name: Publish Shadow handbook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guide-pages
  cancel-in-progress: false

env:
  HUGO_VERSION: '0.167.0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Install Hugo from the official release
        env:
          TOOLS_DIR: ${{ runner.temp }}/hugo
        run: |
          mkdir -p "$TOOLS_DIR"
          cd "$TOOLS_DIR"
          archive="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          release="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          curl --fail --location --silent --show-error "$release/$archive" -o "$archive"
          curl --fail --location --silent --show-error "$release/hugo_${HUGO_VERSION}_checksums.txt" -o checksums.txt
          awk -v file="$archive" '$2 == file { print; found = 1 } END { if (!found) exit 1 }' checksums.txt | sha256sum --check --strict
          tar -xzf "$archive" hugo
          printf '%s\n' "$TOOLS_DIR" >> "$GITHUB_PATH"
      - name: Build the handbook
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo-cache
        run: |
          hugo --source guide --destination dist --baseURL "$PAGES_URL/" --noBuildLock --panicOnWarning
          node guide/check.mjs guide/dist
      - name: Upload only the generated site
        uses: actions/upload-pages-artifact@v5
        with:
          path: guide/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
