[mgr]
ratio = [1, 4, 3]
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
linemode = "none"
show_hidden = false
show_symlink = true
scrolloff = 5

[preview]
wrap = "yes"
tab_size = 2
max_width = 1280
max_height = 900
image_delay = 80
image_filter = "catmull-rom"
image_quality = 80

[opener]
helix = [
  { run = "hx %s", block = true, desc = "Helix · Fast editor", for = "linux" },
]

zed = [
  { run = "zeditor %s", orphan = true, desc = "Zed · GUI editor", for = "linux" },
]

ghostty = [
  { run = "ghostty --working-directory=%s1", orphan = true, desc = "Ghostty · Open here", for = "linux" },
]

system = [
  { run = "xdg-open %s1", orphan = true, desc = "System · Default application", for = "linux" },
]

[open]
prepend_rules = [
  # Directories
  { url = "*/", use = ["system", "zed", "ghostty"] },

  # Text / code / config
  { url = "*.nix", use = ["helix", "zed", "system"] },
  { url = "*.kdl", use = ["helix", "zed", "system"] },
  { url = "*.toml", use = ["helix", "zed", "system"] },
  { url = "*.lua", use = ["helix", "zed", "system"] },
  { mime = "text/*", use = ["helix", "zed", "system"] },

  # Media
  { mime = "image/*", use = ["system"] },
  { mime = "video/*", use = ["system"] },
  { mime = "audio/*", use = ["system"] },

  # Docs
  { mime = "application/pdf", use = ["system"] },

  # Fallback
  { url = "*", use = ["system", "zed"] },
]

# ── Git integration ─────────────────────

[plugin]
prepend_fetchers = [
  { url = "*", run = "git", group = "git" },
  { url = "*/", run = "git", group = "git" },
]
