    [shell.animation]
    enabled = true
    speed = 1.0

    [shell.launcher]
    app_grid = true
    auto_paste = "auto"
    categories = true
    compact = false
    fetch_exchange_rates = true
    pinned = [ "dev.zed.Zed", "brave-origin", "com.mitchellh.ghostty" ]
    provider_prefix = "/"
    show_icons = true
    sort_by_usage = false

        # ── Arbitrary Shell Command ──────────────────────────────────────────────────

        [shell.launcher.dmenu.entry.command]
        label = "Command"
        prefix = "cmd"
        glyph = "terminal"
        global = false
        freeform = true
        exec = '{query}'

        # ── NixOS System Maintenance ────────────────────────────────────────────────

        [shell.launcher.dmenu.entry.nixos]
        label = "NixOS Management"
        prefix = "nix"
        glyph = "terminal"
        global = false

        command = '''
        printf "%s\t%s\n" \
          "System Build"    "Rebuild and switch configuration" \
          "Test Config"     "Build and test configuration without boot entry" \
          "Garbage Collect" "Remove unused store paths" \
          "Update Flake"    "Update flake.lock inputs" \
          "Package Search"  "Interactive nix package search"
        '''

        exec = '''
        case "{selection}" in
          Build*)   cmd="sys-build" ;;
          Test*)    cmd="sys-test" ;;
          Garbage*) cmd="sys-clean" ;;
          Update*)  cmd="sys-update" ;;
          Package*) cmd="sys-search" ;;
        esac

        ghostty -e fish -lc "$cmd; exec fish"
        '''

        # ── Local AI (uncomment with home/programs/ai/local.nix) ───────────────────
#
#         [shell.launcher.dmenu.entry.ai]
#         label = "Local AI"
#         prefix = "ai"
#         glyph = "cpu"
#         global = false
#
#         command = '''
#         printf "%s\t%s\n" \
#           "Start"  "Start llama-swap on 127.0.0.1:8080" \
#           "Chat"   "Open the local chat UI in the browser" \
#           "Stop"   "Stop llama-swap and free the GPU" \
#           "Unload" "Unload models, keep the router running" \
#           "Status" "Show running models and follow the log"
#         '''
#
#         exec = '''
#         case "{selection}" in
#           Start*)  fish -c "ai on" ;;
#           Chat*)   fish -c "ai on; ai chat" ;;
#           Stop*)   fish -c "ai off" ;;
#           Unload*) fish -c "ai unload" ;;
#           Status*) ghostty -e fish -lc "ai status; ai logs" ;;
#         esac
#         '''

        # ── Nix Package Search ───────────────────────────────────────────────────────

        [shell.launcher.dmenu.entry.search]
        label = "Nix Package Search"
        prefix = "search"
        glyph = "search"
        global = false
        freeform = true
        exec = "ghostty -e fish -lc 'sys-search $argv[1]; exec fish' -- \"{query}\""

        # ── Configuration Editing ────────────────────────────────────────────────────

        [shell.launcher.dmenu.entry.edit_nix]
        label = "Edit Nix Config"
        prefix = "edit"
        glyph = "file-code"
        global = false
        command = 'printf "Helix (Terminal)\tOpen nix-config in helix\nZed (GUI)\tOpen nix-config in Zed\n"'
        exec = 'case "{selection}" in Helix*) ghostty -e fish -c "$EDITOR /saved/nixos-config" ;; Zed*) zeditor /saved/nixos-config ;; esac'

        # ── Window Controls ──────────────────────────────────────────────────────────

        [shell.launcher.dmenu.entry.kill_window]
        label = "Kill Active Window"
        prefix = "kill"
        glyph = "circle-x"
        global = false
        command = 'printf "Kill Active Window\tClose current window\n"'
        exec = 'niri msg action close-window'

        # ── Noctalia Settings ────────────────────────────────────────────────────────

        [shell.launcher.dmenu.entry.noctalia_settings]
        label = "Noctalia Settings"
        prefix = "settings"
        glyph = "adjustments"
        global = false
        command = 'printf "Noctalia Settings\tOpen settings panel\n"'
        exec = 'noctalia msg settings-open'

        # ── Wallpaper Picker ─────────────────────────────────────────────────────────

        [shell.launcher.dmenu.entry.wall]
        label = "Wallpaper"
        prefix = "wall"
        glyph = "photo"
        global = false
        command = 'printf "Wallpaper Picker\tOpen Noctalia wallpaper panel\n"'
        exec = 'noctalia msg panel-toggle wallpaper'

        # ── Interactive Sub-Menu: Audio Volume ────────────────────────────────────────

        [shell.launcher.dmenu.entry.volume]
        label = "Audio Volume"
        prefix = "vol"
        glyph = "volume"
        global = false
        command = 'printf "Set Audio Volume\tOpen interactive volume picker\n"'
        exec = 'LEVEL="$(printf "%s\n" 25% 50% 75% 100% 125% 150% | noctalia dmenu -p "Set Sink Volume")"; [ -n "$LEVEL" ] && noctalia msg volume-set "$LEVEL"'

        # ── Interactive Sub-Menu: Power Profiles ─────────────────────────────────────

        [shell.launcher.dmenu.entry.power_profile]
        label = "Power Profile"
        prefix = "power"
        glyph = "bolt"
        global = false
        command = 'printf "Change Power Profile\tSelect performance or saver mode\n"'
        exec = 'MODE="$(printf "%s\n" performance balanced power-saver | noctalia dmenu -p "Power Profile")"; [ -n "$MODE" ] && noctalia msg power-set "$MODE"'

        # ── Built-in Launcher Providers ──────────────────────────────────────────────

        [shell.launcher.providers.calculator]
        global = true
        prefix = "calc"

        [shell.launcher.providers.emoji]
        global = false
        prefix = "emo"

        [shell.launcher.providers.session]
