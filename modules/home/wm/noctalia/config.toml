    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "ghostty", "niri", "zen-browser" ]
    community_ids = [ "zen-browser", "zed" ]

[wallpaper]
enabled = true
fill_color = "primary"
transition_on_startup = true

    [wallpaper.automation]
    enabled = true
    interval_seconds = 500
    recursive = false

    [wallpaper.default]
