[audio]
enable_sounds = true
sound_volume = 1.0

[backdrop]
blur_intensity = 0.2
enabled = true
tint_intensity = 0.4

[bar.default]
background_opacity = 0.8
capsule_foreground = "secondary"
capsule_thickness = 0.75
center = [ "notifications", "clock", "workspaces" ]
contact_shadow = true
end = [ "bluetooth", "volume", "brightness", "control-center", "network", "battery", "session" ]
font_family = "GeistMono Nerd Font Mono"
margin_ends = 0
padding = 15
panel_overlap = 2
position = "bottom"
radius = 80
radius_bottom_left = 0
radius_bottom_right = 0
radius_top_left = 80
radius_top_right = 80
scale = 1.2500000111758709
start = [ "launcher", "wallpaper", "wallhaven", "clipboard", "media", "tray", "animetracker" ]
thickness = 40
widget_spacing = 10

[battery]
warning_threshold = 20

[control_center]
width = 900

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 192.0
    box_width = 224.0
    cx = 144.0
    cy = 130.0
    output = "eDP-2"
    rotation = 0.0
    type = "fancy_audio_visualizer"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        background = false
        bar_width = 0.20000000000000001
        bloom_intensity = 1.0
        fade_when_idle = true
        inner_diameter = 0.5
        ring_opacity = 1.0
        rotation_speed = 0.5
        sensitivity = 1.3
        visualization_mode = "all"
        wave_thickness = 1.0

[hot_corners]
enabled = true

    [hot_corners.bottom_left]
    action = "launcher"

    [hot_corners.bottom_right]
    action = "control_center"
    command = "ghostty"

    [hot_corners.top_left]
    action = "command"
    command = "noctalia msg wallpaper-random"

    [hot_corners.top_right]
    action = "window_switcher"

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
address = "Homs, Syria"

[lockscreen]
blurred_desktop = true
enabled = true

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-2" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-2"]
    box_height = 70.0
    box_width = 400.0
    cx = 720.0
    cy = 781.0
    output = "eDP-2"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

[nightlight]
enabled = true
force = true
temperature_day = 5000
temperature_night = 3000

[osd]
background_opacity = 0.89999997988343239
position = "bottom_center"
position_vertical = "bottom_right"

[plugin_settings."HotZi/anilistTracker"]
anilistPanel_placement = "attached"
anilistPanel_position = "center"

[plugin_settings."noctalia/wallhaven"]
api_key = "LK94jH4RtC8TuvysxJLBCHDOvbHoQews"
browser_placement = "attached"
download_dir = "~/Downloads"

[plugins]
enabled = []

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

[shell]
avatar_path = "/home/aqua/Pictures/profile.jpg"
corner_radius_scale = 2.0
launch_apps_as_systemd_services = true
niri_overview_type_to_launch_enabled = true
password_style = "random"
screen_time_enabled = true
ui_scale = 1.1500000096857548

    [shell.animation]
    speed = 2.0000000298023224

    [shell.launcher]
    app_grid = true

    [shell.panel]
    clipboard_placement = "attached"
    launcher_placement = "attached"
    polkit_placement = "attached"
    transparency_mode = "glass"

    [shell.screen_corners]
    enabled = true
