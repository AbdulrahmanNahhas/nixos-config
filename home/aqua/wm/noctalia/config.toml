[audio]
enable_sounds = true

[backdrop]
enabled = true

[bar.default]
background_opacity = 0.85
center = [ "media", "clock", "notifications" ]
end = [ "bluetooth", "volume", "brightness", "control-center", "network", "battery", "session" ]
margin_ends = 0
padding = 15
radius = 80
radius_top_left = 0
radius_top_right = 0
scale = 1.1
start = [ "launcher", "wallpaper", "workspaces", "clipboard", "tray" ]
thickness = 40
widget_spacing = 10

[control_center]
width = 900

[desktop_widgets]
enabled = false

[hot_corners]
enabled = true

[hot_corners.bottom_right]
action = "command"
command = "ghostty"

[hot_corners.top_left]
action = "control_center"

[hot_corners.top_right]
action = "launcher"

[location]
address = "Homs, Syria"

[lockscreen]
blurred_desktop = true

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-2" ]

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[lockscreen_widgets.widget."lockscreen-login-box@eDP-2"]
box_height = 70.0
box_width = 400.0
cx = 720.0
cy = 781.0
output = "eDP-2"
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@eDP-2".settings]
background_color = "surface_variant"
background_opacity = 0.88
background_radius = 12.0
input_opacity = 1.0
input_radius = 6.0
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true
show_password_hint = true

[nightlight]
enabled = true
force = true
temperature_day = 5000
temperature_night = 3500

[shell]
avatar_path = "/home/aqua/Pictures/profile.jpg"
corner_radius_scale = 2.0
launch_apps_as_systemd_services = true
niri_overview_type_to_launch_enabled = true
password_style = "random"
screen_time_enabled = true
ui_scale = 1.15

[shell.launcher]
app_grid = true

[shell.panel]
clipboard_placement = "attached"
polkit_placement = "attached"
transparency_mode = "soft"

[shell.screen_corners]
enabled = true
size = 50

[shell.screenshot]
directory = "/home/aqua/Pictures/Screenshots"

[theme]
builtin = "Catppuccin"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

[theme.templates]
builtin_ids = [ "gtk3", "gtk4", "ghostty", "niri", "starship" ]
community_ids = [ "zed" ]

[wallpaper]
enabled = true
transition_on_startup = true

[wallpaper.automation]
enabled = true
interval_seconds = 500
recursive = false

[wallpaper.default]
path = "/home/aqua/Pictures/Wallpapers/a_forest_with_tall_trees_and_grass.jpeg"

[wallpaper.last]
path = "/home/aqua/Pictures/Wallpapers/a_forest_with_tall_trees_and_grass.jpeg"

[wallpaper.monitors.eDP-2]
path = "/home/aqua/Pictures/Wallpapers/a_forest_with_tall_trees_and_grass.jpeg"

[widget.battery]
display_mode = "graphic"
scale = 0.90000000000000013

[widget.bluetooth]
hide_when_no_connected_device = true

[widget.brightness]
show_label = false

[widget.control-center]
enabled = false

[widget.media]
anchor = true
hide_when_no_media = true
title_scroll = "on_hover"

[widget.notifications]
hide_when_no_unread = true

[widget.session]
capsule = true
custom_image = "/saved/nixos-config/home/aqua/wm/noctalia/nixos.svg"
custom_image_colorize = true

[widget.tray]
enabled = true

[widget.volume]
show_label = false
