# Local defaults; GitHub Actions overrides this with the Pages URL.
baseURL = 'https://shadow.invalid/'
publishDir = 'public'
title = 'Shadow · Technical handbook'
contentDir = 'docs'
relativeURLs = true
disableKinds = ['taxonomy', 'term', 'RSS', 'sitemap']
[markup.goldmark.renderer]
unsafe = false
[markup.highlight]
noClasses = true
style = 'dracula'
[module]
[[module.mounts]]
source = 'docs'
target = 'content'
[[module.mounts]]
source = 'layouts'
target = 'layouts'
[[module.mounts]]
source = 'assets'
target = 'assets'
[[module.mounts]]
source = 'tools.json'
target = 'data/tools.json'
[[module.mounts]]
source = 'roadmap.json'
target = 'data/roadmap.json'
[[module.mounts]]
source = 'timeline.json'
target = 'data/timeline.json'
[[module.mounts]]
source = '../modules'
target = 'assets/config/modules'
[[module.mounts]]
source = '../shadow'
target = 'assets/config/shadow'
[[module.mounts]]
source = '../flake.nix'
target = 'assets/config/flake.nix'
[[module.mounts]]
source = '../flake.lock'
target = 'assets/config/flake.lock'

[[module.mounts]]
source = 'pages'
target = 'content/pages'

# New reference documents are listed without publishing an extra topic page.
[[cascade]]
[cascade.target]
kind = 'page'
[cascade.build]
render = 'link'
list = 'always'

[params]
repositoryURL = 'https://github.com/AbdulrahmanNahhas/nixos-config'
